name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: the runner has no GPU, and the default wheel pulls several GB of CUDA libraries.
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install pytest
        pip install -e .

    - name: Run unit test suite
      run: |
        pytest tests -v

    - name: Run pipeline smoke test (CPU mode)
      env:
        ALLOW_CPU: "1"
        PYTHON: python
        NUM_WORKERS: "2"
      run: |
        bash scripts/smoke_test.sh
