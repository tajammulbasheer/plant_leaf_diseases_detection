[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-leaf-disease-detection"
version = "0.1.0"
description = "Plant leaf disease classification, out-of-distribution evaluation, continual learning, and localization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tajammul Basheer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "scikit-learn>=1.3.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
demo = [
    "gradio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

